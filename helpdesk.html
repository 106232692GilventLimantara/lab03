<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="COS10026, Web Technology Project, Swinburne, CWA Help Desk Appointment, Help Desk Appointment Form">
    <meta name="author" content="Gilvent Limantara 106232692">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CWA Help Desk Appointment</title>
</head>
<body>
<header>
    <a href="https://www.swin.edu.au"><img src="logo.png" alt="Swinburne University of Technology logo" width="300" height="150"> </a>   
    <h1>CWA Help Desk Appointment</h1>
        
</header>

<p>The Help Desk is located in ATC 620. Open 10:30 to 19:00 Monday to Friday</p>
 
<p> Check Blackboard for when CWA tutors will be there.</p>

<form>
    <fieldset>
        <legend>Student details</legend>
            <p><label for="studentid">Student ID</label> 
			<input type="text" name= "studentid" id="studentid" minlength="7" maxlength="10" pattern="[0-9]+" required="required">
		    </p>
            
            <p>
            <label for="givenname">Given Name</label> 
			<input type="text" name= "givenname" id="givenname" pattern="[A-Za-z]+" maxlength="15" required="required">
		    <label for="familyname">Family Name</label> 
			<input type="text" name= "familyname" id="familyname" pattern="[A-Za-z]+" maxlength="15" required="required">
		    </p>


    </fieldset>
    <fieldset>
        <legend> Your unit</legend>
            <p><input type="radio" id="COS10011" name="unitcode" value="COS10011" required>
                <label for="COS10011">COS10011</label>
				<input type="radio" id="COS60004" name="unitcode" value="COS60004">
                <label for="COS60004">COS60004</label> 
				<input type="radio" id="COS60007" name="unitcode" value="COS60007">
                <label for="COS60007">COS60007</label>
			</p>

        <p><label for="tutor">Your Tutor</label> 
			<select name="tutor" id="tutor" required>
				<option value="">Please Select</option>
                <option value="nick">Nick</option>			
				<option value="feixueyan">Feixue Yan</option>
				<option value="tuan">Tuan Dung Lai</option>
				<option value="atie">Atie Kia</option>
			</select>
		</p>
    </fieldset>
    

    <fieldset>
        <legend>Issue</legend>
            <p>
                <label for="HTML">HTML</label> 
			    <input type="checkbox" id="HTML" name="category[]" value="HTML" checked="checked">
                
                <label for="CSS">CSS</label> 
				<input type="checkbox" id="CSS" name="category[]" value="CSS">

                <label for="JavaScript">JavaScript</label> 
				<input type="checkbox" id="JavaScript" name="category[]" value="JavaScript">
                
                <label for="PHP">PHP</label> 
				<input type="checkbox" id="PHP" name="category[]" value="PHP">
                
                <label for="MySQL">MySQL</label> 
				<input type="checkbox" id="MySQL" name="category[]" value="MySQL">
			</p>

            <p>
                <label for="issue_description" style="display: block;">Description of Issue</label>
                <textarea id="issue_description" name="issue description" rows="4" cols="40" placeholder="Write description of your problem here..."></textarea>
            </p>


    </fieldset>


    <fieldset>
        <legend>Preferred Date / Time</legend>
            <label for="date">Date</label> 
			<input type="text" id="date" name="date" placeholder="dd/mm/yyyy" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[012])/\d{4}" required>
            <label for="time">Time</label>
            <input type="text" id="time" name="time" placeholder="00:00" pattern="([01][0-9]|2[0-3]):[0-5][0-9]" required>
    </fieldset>

    <input type= "submit" value="Book">
	<input type= "reset" value="Reset Form">

</form>
</body>
</html>
